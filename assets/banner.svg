<svg width="860" height="180" viewBox="0 0 860 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00FFD1" stroke-width="0.4" opacity="0.07"/>
    </pattern>
    <pattern id="scanlines" x="0" y="0" width="860" height="3" patternUnits="userSpaceOnUse">
      <rect width="860" height="0.6" fill="#00FFD1" opacity="0.05"/>
    </pattern>
    <filter id="cyanGlow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="amberGlow" x="-5%" y="-40%" width="110%" height="180%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="180" fill="#0a0a0a"/>
  <rect width="860" height="180" fill="url(#grid)"/>
  <rect width="860" height="180" fill="url(#scanlines)"/>

  <!-- Outer border -->
  <rect x="0" y="0" width="860" height="180" fill="none" stroke="#00FFD1" stroke-width="1.2" opacity="0.4"/>
  <!-- Inner border -->
  <rect x="5" y="5" width="850" height="170" fill="none" stroke="#00FFD1" stroke-width="0.4" opacity="0.12"/>

  <!-- Boot text -->
  <text x="16" y="20" font-family="'Courier New',Courier,monospace" font-size="9" fill="#00FFD1" opacity="0.55" letter-spacing="1">BIOS v2.26  ·  GRAPHIC ERA HILL UNIVERSITY  ·  DEHRADUN, INDIA</text>
  <text x="16" y="33" font-family="'Courier New',Courier,monospace" font-size="9" fill="#00FFD1" opacity="0.38" letter-spacing="1">LOADING PROFILE.......  [████████████████████]  100%  OK</text>

  <!-- Divider -->
  <line x1="16" y1="41" x2="844" y2="41" stroke="#00FFD1" stroke-width="0.5" opacity="0.18"/>

  <!-- Main name -->
  <text x="430" y="108"
        font-family="'Courier New',Courier,monospace"
        font-size="56" font-weight="bold"
        fill="#00FFD1" text-anchor="middle"
        filter="url(#cyanGlow)" letter-spacing="10">NITIN RAWAT</text>

  <!-- Tagline with blinking cursor -->
  <text x="430" y="138"
        font-family="'Courier New',Courier,monospace"
        font-size="13" fill="#FFB347"
        text-anchor="middle"
        filter="url(#amberGlow)" letter-spacing="2.5">SYSTEMS BUILDER · DSA GRINDER · FULL-STACK DEV <tspan fill="#00FFD1">█<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>

  <!-- Divider -->
  <line x1="16" y1="148" x2="844" y2="148" stroke="#00FFD1" stroke-width="0.5" opacity="0.18"/>

  <!-- Bottom status -->
  <text x="430" y="163"
        font-family="'Courier New',Courier,monospace"
        font-size="9" fill="#00FFD1"
        text-anchor="middle" opacity="0.42" letter-spacing="1">[ nitinrwt22@github ]  ·  DEHRADUN, INDIA  ·  2ND YEAR CSE  ·  ACTIVELY SEEKING INTERNSHIPS</text>

  <!-- Corner tags -->
  <text x="12" y="176" font-family="'Courier New',Courier,monospace" font-size="9" fill="#FFB347" opacity="0.45">v0.2.26</text>
  <text x="790" y="176" font-family="'Courier New',Courier,monospace" font-size="9" fill="#FFB347" opacity="0.45">C · C++ · JS · PY</text>
</svg>
